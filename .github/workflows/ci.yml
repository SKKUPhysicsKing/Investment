name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[gui,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - if: runner.os == 'Linux'
        run: xvfb-run -a pytest -q
      - if: runner.os == 'Windows'
        run: pytest -q
      - if: runner.os == 'Windows'
        run: python tests/windows_bootstrap_smoke.py
      - run: python -m build
      - run: investment --help
