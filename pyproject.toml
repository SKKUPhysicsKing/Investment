[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-stock-data"
version = "0.1.0"
description = "Fetch reproducible stock price time series from Yahoo Finance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<4", "yfinance>=1.8,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "build>=1,<2"]

[project.scripts]
investment = "investment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
